<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - BudgetFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { brand: { DEFAULT: "#0f766e", light: "#14b8a6", dark: "#115e59" } },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
      .viz-root {
        --viz-income: #2a78d6;
        --viz-expense: #eb6834;
        --viz-grid: #eef2f6;
        --viz-axis: #cbd5e1;
        --viz-muted: #94a3b8;
        --viz-ink: #334155;
        --viz-surface: #ffffff;
      }
      .viz-legend-dot { width: 8px; height: 8px; border-radius: 9999px; display: inline-block; }
      .viz-chart-wrap { position: relative; }
    </style>
  </head>

  <body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-teal-50 text-slate-800 antialiased">
    <!-- NAV -->
    <nav class="sticky top-0 z-50 backdrop-blur bg-white/70 border-b border-slate-200">
      <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-3">
        <a href="/" class="text-xl font-bold tracking-tight text-teal-800">Budget<span class="text-teal-500">Flow</span></a>
        <div id="nav-auth" class="flex items-center gap-4"></div>
      </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-10">
      <!-- HEADER -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl font-bold">Dashboard</h1>
          <p class="text-sm text-slate-500 mt-1" id="welcomeMsg">Your financial overview</p>
        </div>
        <a href="/budgets" class="inline-flex items-center gap-2 bg-teal-700 hover:bg-teal-600 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Manage Budgets
        </a>
      </div>

      <!-- STATUS -->
      <div id="status" class="mb-6">
        <div class="flex items-center gap-3 text-slate-400">
          <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          <span class="text-sm">Loading dashboard...</span>
        </div>
      </div>

      <!-- METRICS CARDS -->
      <div id="metricsSection" class="hidden">
        <div class="grid sm:grid-cols-3 gap-5 mb-8">
          <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-emerald-100 text-emerald-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
              </div>
              <span class="text-sm font-medium text-slate-500">Total Income</span>
            </div>
            <p class="text-2xl font-bold text-emerald-600 tabular-nums" id="income">0.00</p>
          </div>

          <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-red-100 text-red-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg>
              </div>
              <span class="text-sm font-medium text-slate-500">Total Expense</span>
            </div>
            <p class="text-2xl font-bold text-red-600 tabular-nums" id="expense">0.00</p>
          </div>

          <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-sky-100 text-sky-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6m6 0h6m-6 0V9a2 2 0 012-2h2a2 2 0 012 2v10m6 0v-4a2 2 0 00-2-2h-2a2 2 0 00-2 2v4"/></svg>
              </div>
              <span class="text-sm font-medium text-slate-500">Net Balance</span>
            </div>
            <p class="text-2xl font-bold tabular-nums" id="balance">0.00</p>
          </div>
        </div>

        <!-- TREND CHART -->
        <div class="viz-root bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden mb-8">
          <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <h3 class="font-semibold">Income vs Expense Trend</h3>
            <span class="text-xs text-slate-400">Last 6 months</span>
          </div>
          <div class="px-6 py-5">
            <div id="trendEmpty" class="hidden py-12 text-sm text-slate-400 text-center">No trend data yet</div>
            <div id="trendChartWrap" class="viz-chart-wrap h-64">
              <canvas id="trendChart" role="img" aria-label="Monthly income and expense trend"></canvas>
            </div>
          </div>
        </div>

        <!-- CATEGORY BREAKDOWN -->
        <div class="grid lg:grid-cols-2 gap-6 mb-8">
          <div class="viz-root bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
              <h3 class="font-semibold">Category Breakdown</h3>
              <div class="flex items-center gap-3 text-xs text-slate-500">
                <span class="flex items-center gap-1.5"><span class="viz-legend-dot" style="background:var(--viz-income)"></span>Income</span>
                <span class="flex items-center gap-1.5"><span class="viz-legend-dot" style="background:var(--viz-expense)"></span>Expense</span>
              </div>
            </div>
            <div class="px-6 py-5">
              <div id="categoryChartWrap" class="viz-chart-wrap h-56 hidden">
                <canvas id="categoryChart" role="img" aria-label="Spending and income by category"></canvas>
              </div>
            </div>
            <div id="categoryList" class="divide-y divide-slate-50 max-h-72 overflow-y-auto border-t border-slate-50">
              <p class="px-6 py-8 text-sm text-slate-400 text-center">No data</p>
            </div>
          </div>

          <!-- LATEST ENTRIES -->
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100">
              <h3 class="font-semibold">Recent Transactions</h3>
            </div>
            <div id="latestEntries" class="divide-y divide-slate-50 max-h-72 overflow-y-auto">
              <p class="px-6 py-8 text-sm text-slate-400 text-center">No entries</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/public/js/auth.js"></script>
    <script>
      Auth.requireAuth();

      const statusEl = document.getElementById("status");
      const metricsSection = document.getElementById("metricsSection");

      async function loadDashboard() {
        try {
          const data = await api("/dashboard");
          const d = data.data;

          document.getElementById("welcomeMsg").textContent = `Welcome back, ${d.user.name}`;
          document.getElementById("income").textContent = d.metrics.totalIncome.toFixed(2);
          document.getElementById("expense").textContent = d.metrics.totalExpense.toFixed(2);

          const bal = d.metrics.netBalance;
          const balEl = document.getElementById("balance");
          balEl.textContent = bal.toFixed(2);
          balEl.classList.add(bal >= 0 ? "text-emerald-600" : "text-red-600");

          /* Category breakdown */
          const catList = document.getElementById("categoryList");
          if (d.breakdownByCategory.length) {
            catList.innerHTML = d.breakdownByCategory
              .sort((a, b) => b.total - a.total)
              .map(
                (c) => `
                <div class="flex items-center justify-between px-6 py-3">
                  <div class="flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full ${c.type === "income" ? "bg-emerald-500" : "bg-red-500"}"></span>
                    <span class="text-sm">${escapeHtml(c.category)}</span>
                    <span class="text-xs text-slate-400">${c.type}</span>
                  </div>
                  <span class="text-sm font-semibold tabular-nums ${c.type === "income" ? "text-emerald-600" : "text-red-600"}">${c.total.toFixed(2)}</span>
                </div>`
              )
              .join("");
          }

          renderTrendChart(d.monthlyTrend || []);
          renderCategoryChart(d.breakdownByCategory || []);

          /* Latest entries */
          const latestEl = document.getElementById("latestEntries");
          if (d.latestEntries.length) {
            latestEl.innerHTML = d.latestEntries
              .map(
                (e) => `
                <div class="flex items-center justify-between px-6 py-3">
                  <div>
                    <p class="text-sm font-medium">${escapeHtml(e.title)}</p>
                    <p class="text-xs text-slate-400">${escapeHtml(e.category)} &middot; ${new Date(e.entryDate).toLocaleDateString()}</p>
                  </div>
                  <span class="text-sm font-semibold tabular-nums ${e.type === "income" ? "text-emerald-600" : "text-red-600"}">${e.type === "income" ? "+" : "-"}${Number(e.amount).toFixed(2)}</span>
                </div>`
              )
              .join("");
          }

          statusEl.innerHTML = "";
          metricsSection.classList.remove("hidden");
        } catch (err) {
          statusEl.innerHTML = `<div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-3">${err.message}</div>`;
        }
      }

      function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      const VIZ = {
        income: "#2a78d6",
        expense: "#eb6834",
        grid: "#eef2f6",
        axis: "#cbd5e1",
        muted: "#94a3b8",
        ink: "#334155",
        surface: "#ffffff",
      };

      Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', sans-serif";
      Chart.defaults.color = VIZ.muted;

      let trendChart, categoryChart;

      function currency(value) {
        return "$" + Number(value).toLocaleString(undefined, { maximumFractionDigits: 0 });
      }

      function renderTrendChart(monthlyTrend) {
        const wrap = document.getElementById("trendChartWrap");
        const empty = document.getElementById("trendEmpty");
        const hasData = monthlyTrend.some((m) => m.income > 0 || m.expense > 0);

        if (!hasData) {
          wrap.classList.add("hidden");
          empty.classList.remove("hidden");
          return;
        }
        wrap.classList.remove("hidden");
        empty.classList.add("hidden");

        const ctx = document.getElementById("trendChart").getContext("2d");
        const config = {
          type: "line",
          data: {
            labels: monthlyTrend.map((m) => m.label),
            datasets: [
              {
                label: "Income",
                data: monthlyTrend.map((m) => m.income),
                borderColor: VIZ.income,
                backgroundColor: VIZ.income,
                borderWidth: 2,
                pointRadius: 4,
                pointHoverRadius: 5,
                pointBackgroundColor: VIZ.income,
                pointBorderColor: VIZ.surface,
                pointBorderWidth: 2,
                tension: 0.25,
              },
              {
                label: "Expense",
                data: monthlyTrend.map((m) => m.expense),
                borderColor: VIZ.expense,
                backgroundColor: VIZ.expense,
                borderWidth: 2,
                pointRadius: 4,
                pointHoverRadius: 5,
                pointBackgroundColor: VIZ.expense,
                pointBorderColor: VIZ.surface,
                pointBorderWidth: 2,
                tension: 0.25,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: {
                position: "top",
                align: "start",
                labels: { usePointStyle: true, pointStyle: "line", color: VIZ.ink, boxWidth: 24, padding: 16 },
              },
              tooltip: {
                backgroundColor: "#1e293b",
                titleColor: "#f8fafc",
                bodyColor: "#f8fafc",
                padding: 10,
                cornerRadius: 8,
                boxPadding: 4,
                callbacks: {
                  label: (item) => `${item.dataset.label}: ${currency(item.parsed.y)}`,
                },
              },
            },
            scales: {
              x: {
                grid: { display: false },
                border: { color: VIZ.axis },
                ticks: { color: VIZ.muted },
              },
              y: {
                beginAtZero: true,
                grid: { color: VIZ.grid, drawTicks: false },
                border: { display: false },
                ticks: { color: VIZ.muted, callback: (v) => currency(v) },
              },
            },
          },
        };

        if (trendChart) {
          trendChart.data = config.data;
          trendChart.update();
        } else {
          trendChart = new Chart(ctx, config);
        }
      }

      function renderCategoryChart(breakdown) {
        const wrap = document.getElementById("categoryChartWrap");
        if (!breakdown.length) {
          wrap.classList.add("hidden");
          return;
        }
        wrap.classList.remove("hidden");

        const MAX_BARS = 8;
        const sorted = [...breakdown].sort((a, b) => b.total - a.total);
        let bars = sorted.slice(0, MAX_BARS);
        const rest = sorted.slice(MAX_BARS);
        if (rest.length) {
          bars = bars.concat([{ category: "Other", type: "other", total: rest.reduce((s, c) => s + c.total, 0) }]);
        }

        const ctx = document.getElementById("categoryChart").getContext("2d");
        const config = {
          type: "bar",
          data: {
            labels: bars.map((c) => c.category),
            datasets: [
              {
                data: bars.map((c) => c.total),
                backgroundColor: bars.map((c) => (c.type === "income" ? VIZ.income : c.type === "expense" ? VIZ.expense : VIZ.muted)),
                borderRadius: 4,
                borderSkipped: false,
                maxBarThickness: 22,
              },
            ],
          },
          options: {
            indexAxis: "y",
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "#1e293b",
                titleColor: "#f8fafc",
                bodyColor: "#f8fafc",
                padding: 10,
                cornerRadius: 8,
                displayColors: false,
                callbacks: {
                  label: (item) => currency(item.parsed.x),
                },
              },
            },
            scales: {
              x: {
                beginAtZero: true,
                grid: { color: VIZ.grid, drawTicks: false },
                border: { display: false },
                ticks: { color: VIZ.muted, callback: (v) => currency(v) },
              },
              y: {
                grid: { display: false },
                border: { color: VIZ.axis },
                ticks: { color: VIZ.ink },
              },
            },
          },
        };

        if (categoryChart) {
          categoryChart.data = config.data;
          categoryChart.update();
        } else {
          categoryChart = new Chart(ctx, config);
        }
      }

      loadDashboard();
    </script>
  </body>
</html>
